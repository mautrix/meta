# Displayname template for FB/IG users. Available variables:
#  .DisplayName - The display name set by the user.
#  .Username - The username set by the user.
#  .ID - The internal user ID of the user.
displayname_template: '{{or .DisplayName .Username "Unknown user"}}'

# Static proxy address (HTTP or SOCKS5) for connecting to Instagram.
proxy:
# HTTP endpoint to request new proxy address from, for dynamically assigned proxies.
# The endpoint must return a JSON body with a string field called proxy_url.
get_proxy_from:
# Should media be proxied too?
proxy_media: false
# Should other traffic, not configured here, be proxied?
proxy_other: true
# Minimum interval between full reconnects in seconds, default is 1 hour
min_full_reconnect_interval_seconds: 3600
# Interval to force refresh the connection (full reconnect), default is 20 hours. Set 0 to disable force refreshes.
force_refresh_interval_seconds: 72000
# Should connection state be cached to allow quicker restarts?
cache_connection_state: true
# Disable fetching XMA media (reels, stories, etc) when backfilling.
disable_xma_backfill: true
# Disable fetching XMA media entirely.
disable_xma_always: false
# Should typing notification bridging be disabled?
# Bridging typing notifications requires 2 extra connections per user (one for receiving and one for sending),
# because Meta only employs professional software engineers who make excellent architecture decisions.
disable_typing: false
# Should view-once messages be disabled entirely?
disable_view_once: false
# Log raw Bloks payloads and login responses even at debug level, with any user identifiers or credentials redacted.
log_redacted_login_responses: false

# Dedicated HTTP listener for button taps (independent of the appservice listener).
tap_listen: 127.0.0.1:29330
# Use an HTTPS reverse proxy address for access from other devices.
# If empty, links use http://127.0.0.1:<tap_listen port>.
tap_public_address: http://127.0.0.1:29330
# Empty generates a key once and saves it in the bridge KV store.
# Changing this key invalidates old links. Never share the key.
tap_hmac_secret:
# Tap links do not expire. Anyone with a link can send its button, repeatedly.
# GET requests send immediately, including requests from link-preview services.
# Do not log tap request URLs at the reverse proxy.

# Thread backfill settings for syncing older conversations
thread_backfill:
  # Number of batches (pages) to backfill (-1 for unlimited, 0 to disable)
  batch_count: 0
  # Delay between fetching each batch of threads (to avoid rate limiting)
  batch_delay: 2s
  # Maximum number of logins running the full thread backfill at once in this process (0 for no limit).
  # New logins start right away without waiting for the limit.
  max_concurrent: 0
