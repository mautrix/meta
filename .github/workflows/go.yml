name: Go

on: [push, pull_request]

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "1.27"]
    name: Lint ${{ matrix.go-version == '1.27' && '(latest)' || '(old)' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install libolm
        run: sudo apt-get install libolm-dev libolm3

      - name: Build OPAQUE
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo +1.98.1 build --locked --release --manifest-path pkg/messagix/securehistory/opaque/Cargo.toml
          echo "CGO_LDFLAGS=-L$PWD/pkg/messagix/securehistory/opaque/target/release" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          export PATH="$HOME/go/bin:$PATH"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
